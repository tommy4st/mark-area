name: Release & Publish

# Tags are created by scripts/release.sh (devbox run release); they contain the built dist/.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies & build
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run test:e2e:ci

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun pm pack
          gh release create "$GITHUB_REF_NAME" dist/*.js dist/*.d.ts ./*.tgz --title "$GITHUB_REF_NAME" --generate-notes

      - name: Publish to GitHub Packages
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun publish --registry https://npm.pkg.github.com
