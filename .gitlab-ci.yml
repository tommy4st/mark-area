image: oven/bun:latest

stages:
  - check
  - publish

check:
  stage: check
  rules:
    - if: $CI_COMMIT_TAG == null
  script:
    - bun install --frozen-lockfile
    - bun run check
    - bun run test:e2e:ci

# Tags are created by scripts/release.sh (devbox run release).
publish:
  stage: publish
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d/
  variables:
    NPM_CONFIG_TOKEN: $CI_JOB_TOKEN
  script:
    - bun install --frozen-lockfile
    - bun run check
    - bun run test:e2e:ci
    - bun publish --registry "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/npm/"
