name: Publish

# Tags are created by scripts/release.sh (devbox run release).
# Needs the secret PACKAGE_TOKEN: an access token with the write:package scope.
# Runs on the `buildah` runner, which has no Node.js: no JS actions (checkout, setup-bun), plain shell steps only.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: buildah
    env:
      REGISTRY: ${{ github.server_url }}/api/packages/${{ github.repository_owner }}/npm/
    steps:
      - name: Check out repository
        run: |
          SERVER_HOST=$(echo "${{ github.server_url }}" | sed -e 's|^https\?://||')
          git init -q .
          git fetch -q --depth=1 "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@$SERVER_HOST/${{ github.repository }}.git" "${{ github.ref }}"
          git checkout -q FETCH_HEAD

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Typecheck, build and test
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run test:e2e:ci

      - name: Publish (skipped when the version already exists)
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
        run: |
          VERSION=$(bun -p "require('./package.json').version")
          if curl -fsS -H "Authorization: token $NPM_CONFIG_TOKEN" "${REGISTRY}@tommy4st%2Fmark-area" | grep -q "\"$VERSION\""; then
            echo "Version $VERSION already published, skipping"
          else
            bun publish --registry "$REGISTRY"
          fi

      - name: Link package to repository
        run: |
          curl -fsS -X POST -H "Authorization: token ${{ secrets.PACKAGE_TOKEN }}" \
            "${{ github.server_url }}/api/v1/packages/${{ github.repository_owner }}/npm/%40tommy4st%2Fmark-area/-/link/${{ github.event.repository.name }}" \
            || echo "Not linked (already linked?)"
