name: CI

# Runs in `oven/bun` (runner label `bun`, Debian, root): plain shell steps, no JS actions; Playwright installs Chromium with apt.
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: bun
    steps:
      - name: Install git and curl
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git curl ca-certificates

      - name: Check out repository
        run: |
          SERVER_HOST=$(echo "${{ github.server_url }}" | sed -e 's|^https\?://||')
          git init -q .
          git fetch -q --depth=1 "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@$SERVER_HOST/${{ github.repository }}.git" "${{ github.ref }}"
          git checkout -q FETCH_HEAD

      - name: Typecheck, build and unit tests
        run: |
          bun install --frozen-lockfile
          bun run check

      - name: End-to-end tests
        run: bun run test:e2e:ci
